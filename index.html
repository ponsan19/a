<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Video Link Downloader</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="badge">DIRECT MEDIA ONLY</div>
      <h1>Video Link Downloader</h1>
      <p class="lead">
        自分が権利を持つ動画、またはダウンロード許可された動画の
        <strong>直接ファイルURL</strong>（例: .mp4 / .webm）を入力してください。
      </p>

      <label for="url">動画の直リンクURL</label>
      <div class="row">
        <input id="url" type="url" placeholder="https://example.com/video.mp4" autocomplete="off" />
        <button id="check">確認</button>
      </div>

      <p id="status" class="status"></p>

      <video id="preview" controls playsinline hidden></video>

      <div class="actions" id="actions" hidden>
        <a id="download" class="primary" href="#" download>動画を保存</a>
        <a id="open" class="secondary" href="#" target="_blank" rel="noopener">新しいタブで開く</a>
      </div>

      <div class="note">
        <strong>対応:</strong> ブラウザから直接アクセスできる動画ファイルURL。<br>
        配信サイトのページURL、DRM、ログイン必須、署名付きストリーム、
        HLS/DASHの解析・回避には対応していません。
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
